name: Auto-Sync Stream Timelines & Deploy to Vercel

on:
  push:
    branches: [main]
  schedule:
    # Try every 15 minutes; GitHub may delay scheduled jobs under load.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install System Dependencies (ffmpeg & yt-dlp)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Sync Reddit Timelines
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          # Reddit occasionally rejects a GitHub runner request. Retry the
          # complete scrape so a transient 403/429 cannot leave the site stale.
          for attempt in 1 2 3; do
            if python3 scripts/sync_reddit.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Sync attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Extract Missing Frame Screenshots
        continue-on-error: true
        run: |
          python3 scripts/extract_all_frames.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/daysData.json public/images/frames/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): automated stream recap & screenshot updates [skip ci]"
            git push
            echo "Updates pushed to main. Vercel deployment triggered automatically."
          else
            echo "No new updates found. Working tree is clean."
          fi
