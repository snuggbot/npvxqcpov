name: Auto-Sync Stream Timelines & Deploy to Vercel

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (ffmpeg & yt-dlp)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Sync Reddit Timelines
        run: |
          python3 scripts/sync_reddit.py

      - name: Extract Missing Frame Screenshots
        run: |
          python3 scripts/extract_all_frames.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/daysData.json public/images/frames/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): automated stream recap & screenshot updates [skip ci]"
            git push
            echo "Updates pushed to main. Vercel deployment triggered automatically."
          else
            echo "No new updates found. Working tree is clean."
          fi
